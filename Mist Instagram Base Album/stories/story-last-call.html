<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mist — Last call</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #2a2a2a; }
.frame { width: 1080px; height: 1920px; overflow: hidden; }
</style>
</head>
<body>
<!-- Story · Moody: last call · 1080 × 1920 px. Edit the text between the tags; colours and sizes are in the style attributes. -->
<div class="frame">
<div style="width: 1080px; height: 1920px; box-sizing: border-box; overflow: hidden; display: grid; grid-template-columns: 1080px; grid-template-rows: 1920px; background: #0b0908; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; color: #f1e6d2">
<img src="../assets/mist-moody-18-last-call.webp" alt="One last cocktail on a table at closing time, a single lamp still on" style="grid-column: 1; grid-row: 1; display: block; width: 1080px; height: 1920px; object-fit: cover; object-position: center 60%">
<div style="grid-column: 1; grid-row: 1; align-self: start; width: 1080px; height: 1000px; background: linear-gradient(180deg, rgba(11,9,8,0.9) 0%, rgba(11,9,8,0.9) 25%, rgba(11,9,8,0.55) 60%, rgba(11,9,8,0) 100%)"></div>
<div style="grid-column: 1; grid-row: 1; align-self: start; box-sizing: border-box; width: 1080px; padding: 270px 80px 0; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<img src="../assets/mist-logo-gold.svg" alt="Mist" style="display: block; height: 180px; width: auto">
<div style="font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: 0.22em; color: #d6b56e">TONIGHT</div>
<div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 124px; line-height: 128px">Last call<br>[01:00]</div>
</div>
<div style="grid-column: 1; grid-row: 1; align-self: end; width: 1080px; height: 1050px; background: linear-gradient(0deg, rgba(11,9,8,0.93) 0%, rgba(11,9,8,0.93) 25%, rgba(11,9,8,0.55) 60%, rgba(11,9,8,0) 100%)"></div>
<div style="grid-column: 1; grid-row: 1; align-self: end; box-sizing: border-box; width: 1080px; padding: 0 80px 330px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<div style="font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: 0.22em; color: #d6b56e">SEE YOU IN THE MIST</div>
</div>
</div>
</div>
</body>
</html>
