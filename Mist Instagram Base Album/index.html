<script>
(function () {
  var buttons = document.querySelectorAll('.tabs button');
  var posts = document.getElementById('posts');
  var stories = document.getElementById('stories');
  function show(view) {
    if (['posts', 'stories', 'all'].indexOf(view) < 0) view = 'posts';
    posts.hidden = view === 'stories';
    stories.hidden = view === 'posts';
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === view)); });
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.view); window.scrollTo(0, 0); }); });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'posts');
})();
</script>
