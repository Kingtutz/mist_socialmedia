<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mist — Opening announcement</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #2a2a2a; }
.frame { width: 1080px; height: 1350px; overflow: hidden; }
</style>
</head>
<body>
<!-- 03 · Opening · 1080 × 1350 px. Edit the text between the tags; colours and sizes are in the style attributes. -->
<div class="frame">
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #0f3a24; padding: 72px; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; color: #f1e6d2">
<div style="width: 100%; height: 100%; box-sizing: border-box; border: 2px solid #d6b56e; padding: 10px">
<div style="width: 100%; height: 100%; box-sizing: border-box; border: 2px solid #d6b56e; padding: 96px 64px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center">
<img src="../assets/mist-logo-gold.svg" alt="Mist" style="display: block; height: 220px; width: auto">
<div style="display: flex; flex-direction: column; align-items: center; gap: 28px">
<div style="font-size: 30px; line-height: 36px; font-weight: 500; letter-spacing: 0.22em; color: #d6b56e">GRAND OPENING</div>
<div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 120px; line-height: 124px; letter-spacing: -0.01em">The doors<br>open</div>
<div style="font-size: 64px; line-height: 72px; letter-spacing: 0.08em; color: #d6b56e">[FRIDAY 13 NOVEMBER]</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 34px; line-height: 48px">Doors at nine. Tables held until ten.</div>
<div style="font-size: 26px; line-height: 34px; letter-spacing: 0.22em; color: #d6b56e">[STREET ADDRESS] · [CITY]</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
