</div>
<div style="grid-column: 1; grid-row: 1; align-self: end; box-sizing: border-box; width: 1080px; padding: 0 72px 128px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<div style="font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: 0.22em; color: #d6b56e">EVERY FRIDAY · [FROM 21:00]</div>
<div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 112px; line-height: 116px">Champagne,<br>stacked high.</div>
</div>
</div>
</div>
