<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mist — Mood line</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #2a2a2a; }
.frame { width: 1080px; height: 1350px; overflow: hidden; }
</style>
</head>
<body>
<!-- 05 · Mood line · 1080 × 1350 px. Edit the text between the tags; colours and sizes are in the style attributes. -->
<div class="frame">
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #0b0908; padding: 120px 96px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; color: #f1e6d2">
<div style="display: flex; align-items: center; gap: 24px">
<div style="font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: 0.22em; color: #a8987f">AFTER MIDNIGHT</div>
<div style="flex-grow: 1; height: 1px; background: #3a2f24"></div>
</div>
<div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 136px; line-height: 144px; letter-spacing: -0.01em">Low light.<br>Long pours.<br><span style="color: #d6b56e">Slow evenings.</span></div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<img src="../assets/mist-logo-gold.svg" alt="Mist" style="display: block; height: 200px; width: auto">
<div style="font-size: 26px; line-height: 32px; letter-spacing: 0.22em; color: #a8987f; padding-bottom: 18px">[@MIST]</div>
</div>
</div>
</div>
</body>
</html>
