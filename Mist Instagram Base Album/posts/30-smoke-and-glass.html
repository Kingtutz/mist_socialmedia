<div class="frame">
<div style="width: 1080px; height: 1350px; box-sizing: border-box; overflow: hidden; display: grid; grid-template-columns: 1080px; grid-template-rows: 1350px; background: #0b0908; font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif; color: #f1e6d2">

<div style="grid-column: 1; grid-row: 1; align-self: start; width: 1080px; height: 560px; background: linear-gradient(180deg, rgba(11,9,8,0.8) 0%, rgba(11,9,8,0.8) 25%, rgba(11,9,8,0.55) 60%, rgba(11,9,8,0) 100%)"></div>
<div style="grid-column: 1; grid-row: 1; align-self: start; box-sizing: border-box; width: 1080px; padding: 112px 72px 0; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
<div style="font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: 0.22em; color: #d6b56e">SMOKED TO ORDER</div>
<div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 104px; line-height: 110px">Lift the glass.</div>
</div>
</div>
