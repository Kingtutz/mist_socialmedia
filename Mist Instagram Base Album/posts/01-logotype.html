<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Mist — Logotype post</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap"
            rel="stylesheet" />
        <style>
            body {
                margin: 0;
                background: #2a2a2a;
            }
            .frame {
                width: 1080px;
                height: 1350px;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <!-- 01 · Logotype · 1080 × 1350 px. Edit the text between the tags; colours and sizes are in the style attributes. -->
        <div class="frame">
            <div
                style="
                    width: 1080px;
                    height: 1350px;
                    box-sizing: border-box;
                    background: #5a1018;
                    padding: 96px 72px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: space-between;
                    font-family:
                        &quot;Jost&quot;, &quot;Futura&quot;,
                        &quot;Century Gothic&quot;, sans-serif;
                    color: #f1e6d2;
                ">
                <div
                    style="
                        font-size: 26px;
                        line-height: 32px;
                        font-weight: 500;
                        letter-spacing: 0.22em;
                        color: #d6b56e;
                    ">
                    COCKTAIL BAR
                </div>
                <div
                    style="
                        width: 640px;
                        height: 860px;
                        box-sizing: border-box;
                        border: 2px solid #d6b56e;
                        border-radius: 9999px 9999px 0 0;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        gap: 40px;
                        padding: 48px;
                    ">
                    <div style="display: flex; gap: 22px">
                        <div
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #f0d9a0;
                            "></div>
                        <div
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #f0d9a0;
                            "></div>
                        <div
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #f0d9a0;
                            "></div>
                        <div
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #f0d9a0;
                            "></div>
                        <div
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #f0d9a0;
                            "></div>
                    </div>
                    <img
                        src="../assets/mist-logo-gold.svg"
                        alt="Mist"
                        style="display: block; height: 460px; width: auto" />
                    <div
                        style="
                            font-family:
                                &quot;Playfair Display&quot;, Georgia, serif;
                            font-style: italic;
                            font-size: 44px;
                            line-height: 52px;
                            color: #f1e6d2;
                            text-align: center;
                        ">
                        Low light, long pours
                    </div>
                </div>
                <div
                    style="
                        font-size: 26px;
                        line-height: 32px;
                        font-weight: 500;
                        letter-spacing: 0.22em;
                        color: #d6b56e;
                    ">
                    [Malmö] · [@Mist]
                </div>
            </div>
        </div>
    </body>
</html>
